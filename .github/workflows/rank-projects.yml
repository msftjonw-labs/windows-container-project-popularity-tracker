name: Windows Container Project Popularity Tracker
on:
  schedule:
    - cron: '0 17 * * 1' # Monday 09:00 fixed PST (UTC-8), year-round
  workflow_dispatch: # Allows manual triggers from the Actions tab

concurrency:
  group: popularity-project-sync
  cancel-in-progress: false

jobs:
  evaluate-and-sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Generates a temporary GitHub App installation token
      - name: Generate GitHub App Token
        uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Test Scoring & Sync Script
        run: python -m unittest discover -s tests -v

      # Passes the dynamically generated GitHub App token into the script via GH_TOKEN
      - name: Run Scoring & Sync Script
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_PROJECT_ID: ${{ vars.GH_PROJECT_ID }}
          GH_SCORE_FIELD_ID: ${{ vars.GH_SCORE_FIELD_ID }}
        run: python scripts/score_projects.py

      - name: Save PDF Report History
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- report-history/*.pdf
          if git diff --cached --quiet; then
            echo "No report changes to save."
            exit 0
          fi
          git commit -m "Save generated popularity report"
          git push

      - name: Send Success Email
        if: ${{ success() }}
        env:
          SMTP_HOST: ${{ vars.SMTP_HOST }}
          SMTP_PORT: ${{ vars.SMTP_PORT }}
          SMTP_SECURITY: ${{ vars.SMTP_SECURITY || 'starttls' }}
          SMTP_FROM: ${{ vars.SMTP_FROM }}
          SMTP_TO: ${{ vars.SMTP_TO }}
          SMTP_USERNAME: ${{ vars.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        run: python scripts/send_success_email.py
